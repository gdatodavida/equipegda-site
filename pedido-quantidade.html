<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido — Camisa Oficial GDA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;background:#14110F;}
  a{text-decoration:none;}
  a:hover{opacity:0.85;}
  button{cursor:pointer;}
  .gda-qtd-grid{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px;}
  @media (max-width: 480px){
    .gda-qtd-grid{grid-template-columns:repeat(2, minmax(0, 1fr));row-gap:10px;}
    .gda-qtd-grid button{font-size:12px !important;line-height:1.3 !important;white-space:normal !important;padding:10px 4px !important;}
  }
</style>
</head>
<body>
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #14110F; font-family: 'Manrope', sans-serif;">

  <header style="position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 40px; background: rgba(20,17,15,0.94); border-bottom: 1px solid rgba(245,241,234,0.10); backdrop-filter: blur(6px);">
    <a href="index.html" style="display: flex; align-items: center; gap: 12px;">
      <img src="img/4ac9e9bf08b452d271c1706be86e366d.png" alt="Equipe GDA" style="height: 32px; width: auto; display: block;">
    </a>
    <a href="pedido-tamanho.html" style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600; color: #D8D2C7;">← Voltar</a>
  </header>

  <section style="padding: 20px 40px 100px; background: #1A1512; box-sizing: border-box; flex: 1;">
    <div style="max-width: 560px; margin: 60px auto 0; display: flex; flex-direction: column; gap: 28px; padding: 40px 36px; background: #211B17; border: 1px solid rgba(245,241,234,0.08); border-radius: 20px; box-sizing: border-box;">

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #FFDB00;">Passo 5 de 6</span>
        <h2 style="margin: 0; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; color: #F5F1EA;">Quantas camisas?</h2>
      </div>

      <div class="gda-qtd-grid" id="grid-camisa">
        <button type="button" data-qtd="1" style="display: flex; align-items: center; justify-content: center; padding: 12px 4px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: transparent; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 13px; color: #F5F1EA; text-align: center;">01 CAMISA</button>
        <button type="button" data-qtd="2" style="display: flex; align-items: center; justify-content: center; padding: 12px 4px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: transparent; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 13px; color: #F5F1EA; text-align: center;">02 CAMISAS</button>
        <button type="button" data-qtd="3" style="display: flex; align-items: center; justify-content: center; padding: 12px 4px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: transparent; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 13px; color: #F5F1EA; text-align: center;">03 CAMISAS</button>
        <button type="button" data-qtd="4" style="display: flex; align-items: center; justify-content: center; padding: 12px 4px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: transparent; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 13px; color: #F5F1EA; text-align: center;">+ UNIDADES</button>
      </div>
      <span style="font-family: 'Manrope', sans-serif; font-style: italic; font-size: 12px; color: #6B655C; margin-top: -14px;">Toque na quantidade desejada.</span>

      <div style="height: 1px; background: rgba(245,241,234,0.08);"></div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; color: #F5F1EA;">Quer aproveitar e levar uma balaclava?</span>
          <span style="font-family: 'Manrope', sans-serif; font-size: 13px; color: #A89C8E;">R$ 39,90 cada — opcional</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
          <img src="img/b92ecb7406a4f2dc1f611a0f660bebf5.jpg" alt="Balaclava oficial GDA sendo usada" style="width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: center top; border-radius: 12px; border: 1px solid rgba(245,241,234,0.12); display: block;">
          <img src="img/84337e545f99fae3b3522a4e6c48c0d8.jpg" alt="Balaclava oficial GDA — frente e verso" style="width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: center; border-radius: 12px; border: 1px solid rgba(245,241,234,0.12); display: block;">
          <img src="img/12edcc1081f496373c14330e8db03f15.jpg" alt="Balaclava oficial GDA sendo usada" style="width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: center top; border-radius: 12px; border: 1px solid rgba(245,241,234,0.12); display: block;">
        </div>
        <div class="gda-qtd-grid" id="grid-balaclava">
          <button type="button" data-qtd="1" style="display: flex; align-items: center; justify-content: center; padding: 11px 4px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: transparent; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 12px; color: #F5F1EA; text-align: center;">1 BALACLAVA</button>
          <button type="button" data-qtd="2" style="display: flex; align-items: center; justify-content: center; padding: 11px 4px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: transparent; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 12px; color: #F5F1EA; text-align: center;">2 BALACLAVAS</button>
          <button type="button" data-qtd="3" style="display: flex; align-items: center; justify-content: center; padding: 11px 4px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: transparent; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 12px; color: #F5F1EA; text-align: center;">3 BALACLAVAS</button>
          <button type="button" data-qtd="4" style="display: flex; align-items: center; justify-content: center; padding: 11px 4px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: transparent; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 12px; color: #F5F1EA; text-align: center;">+ UNIDADES</button>
        </div>
        <span style="font-family: 'Manrope', sans-serif; font-style: italic; font-size: 12px; color: #6B655C;">Toque pra escolher. Toque de novo pra remover — a balaclava é opcional.</span>
      </div>

      <a id="link-continuar-resumo" href="pedido-resumo.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border-radius: 999px; background-color: #FFDB00; color: #14110F; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px;">Continuar →</a>
    </div>
  </section>

  <footer style="padding: 40px 40px 32px; background: #0F0C0A; border-top: 1px solid rgba(245,241,234,0.08); box-sizing: border-box;">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
      <span style="font-family: 'Manrope', sans-serif; font-size: 13px; color: #7A7369;">2024 © Equipe GDA. Todos os direitos reservados.</span>
      <a href="index.html" style="font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; color: #D8D2C7;">Voltar ao portal</a>
    </div>
  </footer>

</div>

<script>
(function () {
  'use strict';
  var params;
  try { params = new URLSearchParams(window.location.search); } catch (err) { params = null; }
  function get(key) { try { return (params && params.get(key)) || ''; } catch (err) { return ''; } }
  var item = get('item') === 'feminina' ? 'feminina' : 'masculina';
  var piloto = get('piloto');
  var nome = get('nome');
  var identificacao = get('identificacao');
  var whatsapp = get('whatsapp');
  var tamanho = get('tamanho');

  var quantidadeCamisa = 1;
  var quantidadeBalaclava = 0;

  var link = document.getElementById('link-continuar-resumo');
  var botoesCamisa = document.querySelectorAll('#grid-camisa button');
  var botoesBalaclava = document.querySelectorAll('#grid-balaclava button');

  function pillStyle(active) {
    return active
      ? { border: '2px solid #FFDB00', background: 'rgba(255,219,0,0.1)', color: '#FFDB00' }
      : { border: '1px solid rgba(245,241,234,0.16)', background: 'transparent', color: '#F5F1EA' };
  }

  function applyStyle(btn, active) {
    var s = pillStyle(active);
    btn.style.border = s.border;
    btn.style.background = s.background;
    btn.style.color = s.color;
  }

  function render() {
    botoesCamisa.forEach(function (btn) {
      var n = parseInt(btn.getAttribute('data-qtd'), 10);
      applyStyle(btn, n >= 4 ? quantidadeCamisa >= 4 : quantidadeCamisa === n);
    });
    botoesBalaclava.forEach(function (btn) {
      var n = parseInt(btn.getAttribute('data-qtd'), 10);
      applyStyle(btn, n >= 4 ? quantidadeBalaclava >= 4 : quantidadeBalaclava === n);
    });
    var qs = 'item=' + item + '&piloto=' + encodeURIComponent(piloto) + '&nome=' + encodeURIComponent(nome) +
      '&identificacao=' + encodeURIComponent(identificacao) + '&whatsapp=' + encodeURIComponent(whatsapp) +
      '&tamanho=' + encodeURIComponent(tamanho) + '&quantidadeCamisa=' + quantidadeCamisa + '&quantidadeBalaclava=' + quantidadeBalaclava;
    link.href = 'pedido-resumo.html?' + qs;
  }

  botoesCamisa.forEach(function (btn) {
    btn.addEventListener('click', function () {
      quantidadeCamisa = parseInt(btn.getAttribute('data-qtd'), 10);
      render();
    });
  });

  // não existe um botão explícito de "nenhuma balaclava" no design, então
  // tocar de novo numa quantidade já selecionada desmarca ela
  botoesBalaclava.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var n = parseInt(btn.getAttribute('data-qtd'), 10);
      quantidadeBalaclava = quantidadeBalaclava === n ? 0 : n;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
