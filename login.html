<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Área restrita Equipe GDA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;background:#14110F;}
  a{text-decoration:none;}
  a:hover{opacity:0.85;}
  input{outline:none;}
  input:focus{border-color:#FFDB00;}
  button{cursor:pointer;}
</style>
</head>
<body>
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #14110F; font-family: 'Manrope', sans-serif;">

  <header style="position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 40px; background: rgba(20,17,15,0.94); border-bottom: 1px solid rgba(245,241,234,0.10); backdrop-filter: blur(6px);">
    <a href="index.html" style="display: flex; align-items: center; gap: 12px;">
      <img src="img/4ac9e9bf08b452d271c1706be86e366d.png" alt="Equipe GDA" style="height: 32px; width: auto; display: block;">
    </a>
    <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600; color: #D8D2C7;">← Voltar ao portal</a>
  </header>

  <section style="display: flex; align-items: center; justify-content: center; flex: 1; padding: 60px 40px; box-sizing: border-box;">
    <div style="max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 24px; padding: 40px 36px; background: #211B17; border: 1px solid rgba(245,241,234,0.08); border-radius: 20px; box-sizing: border-box;">

      <div style="display: flex; flex-direction: column; gap: 8px; text-align: center;">
        <span style="font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #FFDB00;">Área restrita</span>
        <h1 style="margin: 0; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; color: #F5F1EA;">Login da equipe de suporte</h1>
        <p style="margin: 0; font-family: 'Manrope', sans-serif; font-size: 14px; line-height: 1.6; color: #A89C8E;">Entre com o e-mail e senha criados no Supabase pra acessar os painéis administrativos.</p>
      </div>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="login-email" style="font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; color: #D8D2C7;">E-mail</label>
          <input id="login-email" name="login-email" type="email" autocomplete="username" placeholder="voce@equipegda.com.br" style="width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: #171310; color: #F5F1EA; font-family: 'Manrope', sans-serif; font-size: 15px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="login-senha" style="font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; color: #D8D2C7;">Senha</label>
          <input id="login-senha" name="login-senha" type="password" autocomplete="current-password" placeholder="••••••••" style="width: 100%; box-sizing: border-box; padding: 13px 16px; border-radius: 10px; border: 1px solid rgba(245,241,234,0.16); background: #171310; color: #F5F1EA; font-family: 'Manrope', sans-serif; font-size: 15px;">
        </div>

        <span id="login-error" style="display: none; font-family: 'Manrope', sans-serif; font-size: 13px; color: #DC5A5A;"></span>

        <button id="btn-entrar" type="submit" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border-radius: 999px; background-color: #FFDB00; color: #14110F; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; border: none;">Entrar</button>
      </form>
    </div>
  </section>

  <footer style="padding: 40px 40px 32px; background: #0F0C0A; border-top: 1px solid rgba(245,241,234,0.08); box-sizing: border-box;">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
      <span style="font-family: 'Manrope', sans-serif; font-size: 13px; color: #56504A;">© 2026 Equipe GDA — GDA toda vida.</span>
      <a href="index.html" style="font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; color: #D8D2C7;">Voltar ao portal</a>
    </div>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
(function () {
  'use strict';

  function redirectTarget() {
    try {
      var params = new URLSearchParams(window.location.search);
      var r = params.get('redirect');
      if (r === 'painel-cadastros.html' || r === 'painel-pedidos.html') return r;
    } catch (err) {}
    return 'painel-cadastros.html';
  }

  // já logado? pula direto pro painel
  if (window.gdaSupabase) {
    window.gdaSupabase.auth.getSession().then(function (result) {
      var session = result && result.data && result.data.session;
      if (session) window.location.href = redirectTarget();
    });
  }

  var form = document.getElementById('login-form');
  var errEl = document.getElementById('login-error');
  var btn = document.getElementById('btn-entrar');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!window.gdaSupabase) {
      errEl.textContent = 'Não foi possível conectar ao banco de dados. Tente recarregar a página.';
      errEl.style.display = '';
      return;
    }
    var email = document.getElementById('login-email').value.trim();
    var senha = document.getElementById('login-senha').value;
    if (!email || !senha) {
      errEl.textContent = 'Preencha e-mail e senha.';
      errEl.style.display = '';
      return;
    }
    errEl.style.display = 'none';
    btn.textContent = 'Entrando…';
    btn.style.opacity = '0.6';

    window.gdaSupabase.auth.signInWithPassword({ email: email, password: senha }).then(function (result) {
      if (result.error) {
        errEl.textContent = 'E-mail ou senha incorretos.';
        errEl.style.display = '';
        btn.textContent = 'Entrar';
        btn.style.opacity = '1';
        return;
      }
      window.location.href = redirectTarget();
    });
  });
})();
</script>
</body>
</html>
